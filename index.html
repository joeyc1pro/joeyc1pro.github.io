<script>

    /* =================================
       BROWSER TAB TITLE ANIMATION
    ================================= */

    const titles = [
        "Joey",
        "JoeyC1Pro",
        "Joey's Website",
        "joeyc1pro"
    ];

    let titleIndex = 0;
    let charIndex = 0;
    let deleting = false;

    const typeSpeed = 100;
    const deleteSpeed = 55;

    const pauseAfterTyping = 1700;
    const pauseAfterDeleting = 500;


    function animateTitle() {

        const current = titles[titleIndex];

        if (!deleting) {

            document.title =
                current.substring(0, charIndex + 1);

            charIndex++;

            if (charIndex >= current.length) {

                setTimeout(() => {
                    deleting = true;
                    animateTitle();
                }, pauseAfterTyping);

                return;
            }

            setTimeout(
                animateTitle,
                typeSpeed
            );

        } else {

            document.title =
                current.substring(0, charIndex - 1);

            charIndex--;

            if (charIndex <= 0) {

                deleting = false;

                titleIndex =
                    (titleIndex + 1) % titles.length;

                setTimeout(
                    animateTitle,
                    pauseAfterDeleting
                );

                return;
            }

            setTimeout(
                animateTitle,
                deleteSpeed
            );
        }
    }

    animateTitle();

</script>
