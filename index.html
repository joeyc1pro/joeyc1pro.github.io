<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title></title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background"></div>

    <main class="profile-card">

        <div class="avatar">
            <span>J</span>
        </div>

        <h1>Joey</h1>

        <p class="username">@joeyc1pro</p>

        <p class="bio">
            developer • gamer • creator
        </p>

        <div class="socials">

            <a href="#" class="social">
                <span class="social-icon">◉</span>
                <span>Discord</span>
                <span class="arrow">↗</span>
            </a>

            <a href="https://github.com/joeyc1pro" class="social" target="_blank">
                <span class="social-icon">⌘</span>
                <span>GitHub</span>
                <span class="arrow">↗</span>
            </a>

        </div>

        <div class="section-title">
            <span>PROJECTS</span>
        </div>

        <a
            href="https://joeyc1pro.github.io/amplify-home-xyz"
            target="_blank"
            class="project"
        >
            <div class="project-icon">
                🎮
            </div>

            <div class="project-info">
                <h2>Amplify</h2>
                <p>Unblocked games website</p>
            </div>

            <div class="project-arrow">↗</div>
        </a>

        <div class="status">
            <span class="status-dot"></span>
            <span>online</span>
        </div>

    </main>

    <div class="footer">
        joeyc1pro
    </div>


    <script>
        /*
            Browser tab title animation
            Types → pauses → backspaces → next title
        */

        const titles = [
            "Joey",
            "JoeyC1Pro",
            "Joey's Website",
            "joeyc1pro.github.io"
        ];

        let titleIndex = 0;
        let charIndex = 0;
        let deleting = false;

        const typeSpeed = 100;
        const deleteSpeed = 60;
        const pauseAfterTyping = 1500;
        const pauseAfterDeleting = 400;

        function typeTitle() {

            const currentTitle = titles[titleIndex];

            if (!deleting) {

                document.title =
                    currentTitle.substring(0, charIndex + 1);

                charIndex++;

                if (charIndex >= currentTitle.length) {

                    setTimeout(() => {
                        deleting = true;
                        typeTitle();
                    }, pauseAfterTyping);

                    return;
                }

                setTimeout(typeTitle, typeSpeed);

            } else {

                document.title =
                    currentTitle.substring(0, charIndex - 1);

                charIndex--;

                if (charIndex <= 0) {

                    deleting = false;

                    titleIndex =
                        (titleIndex + 1) % titles.length;

                    setTimeout(typeTitle, pauseAfterDeleting);

                    return;
                }

                setTimeout(typeTitle, deleteSpeed);
            }
        }

        typeTitle();
    </script>

</body>
</html>
